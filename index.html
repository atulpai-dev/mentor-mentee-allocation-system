<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor–Mentee Coordination</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <div class="app-bar">
        <img src="assets/images/logo.png" alt="Logo">
       
    </div>
    <div class="content">
        <img src="assets/images/logo_elites.png" alt="Above Button" class="above-button-image">

        <button class="button" type="button" onclick="showOptions()">Enter the Name</button>
        <div id="options" class="hidden">
            <button class="button" type="button" onclick="selectOption('Mentor')">Mentor</button>
            <button class="button" type="button" onclick="selectOption('Mentee')">Mentee</button>
        </div>
        <div class="textbox" id="textbox">
            <input type="text" id="nameInput" placeholder="Enter name here..." oninput="changeButtonColor()">
            <button id="okButton" type="button" onclick="fetchDetails()">OK</button>
        </div>
    </div>

    <script src="assets/js/scripts.js"></script>

</body>
</html>
